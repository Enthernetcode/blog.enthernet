<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Day 31: Ansible Facts</title>
<desc id="desc">Pic of the Day for #100DaysOfCloudAndSecurity: Facts let automation discover the host it is operating on instead of hard-coding assumptions about every machine.</desc>
